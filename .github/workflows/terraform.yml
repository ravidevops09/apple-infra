name: Terraform CI-CD

on:
  push:
    branches:
      - "feature/**"
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.12.2"
  TF_WORKING_DIR: environment/prod

  AZURE_CLIENT_ID: "86734bc2-6a77-42e6-a6f4-e3aa7e60a4c9"
  AZURE_TENANT_ID: "fb1b5976-83f6-496f-974f-151c265282f4"
  AZURE_SUBSCRIPTION_ID: "ef72840d-82bf-473c-a6d3-6071256e8393"

jobs:
  terraform:
    name: Terraform Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./environment/prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan